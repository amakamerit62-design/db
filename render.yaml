# Render Deployment Configuration
# ⚠️ DEPRECATED - Render does NOT support .NET Framework 4.8
#
# Render only supports Linux containers. .NET Framework 4.8 requires Windows.
#
# To deploy on Render, you would need to:
# 1. Convert entire project to .NET 8 (4+ hours refactoring)
# 2. Remove Windows Forms UI (convert to console/web app)
# 3. Use Linux base Docker image
#
# RECOMMENDED: Use Azure App Service instead (see DEPLOYMENT.md)
# - Native Windows support
# - .NET Framework 4.8 pre-installed
# - WebSocket support built-in
# - $0-15/month cost
#
# This file is kept for reference only
